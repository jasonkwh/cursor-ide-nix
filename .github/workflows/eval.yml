name: Evaluate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: ${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Eval ${{ matrix.system }} cursor
        run: |
          set -euo pipefail
          nix eval --raw ".#packages.${{ matrix.system }}.cursor.drvPath" \
            | tee /tmp/drvPath
          test -s /tmp/drvPath
          printf '%s eval ok -> %s\n' "${{ matrix.system }}" "$(cat /tmp/drvPath)"
